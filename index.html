<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>하나님의 목적지 도시 찾기</title>
  <style>
    :root{
      --panelW: 390px;
      --bg: #f4f7fb;
      --card: rgba(255,255,255,.94);
      --shadow: 0 14px 28px rgba(0,0,0,.14);
      --radius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Pretendard, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background: var(--bg);
    }
    .app{
      display:flex;
      height:100vh;
      overflow:hidden;
    }
    .panel{
      width: var(--panelW);
      background: var(--card);
      backdrop-filter: blur(6px);
      box-shadow: var(--shadow);
      padding: 14px 14px 18px;
      z-index: 10;
      overflow:auto;
    }
    .title{
      font-weight: 1000;
      font-size: 18px;
      margin: 4px 0 10px;
    }
    .step{
      font-weight: 1000;
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:12px;
    }
    .desc{
      color:#222;
      line-height:1.5;
      font-size:13px;
      margin: 10px 0 12px;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .btn{
      border:0;
      cursor:pointer;
      padding: 11px 12px;
      border-radius: 14px;
      background:#111;
      color:#fff;
      font-weight:1000;
      box-shadow: 0 10px 18px rgba(0,0,0,.12);
    }
    .btn.secondary{
      background:#fff;
      color:#111;
      border:1px solid rgba(0,0,0,.12);
      box-shadow:none;
    }
    .btn.small{
      padding: 9px 10px;
      border-radius: 12px;
      font-weight: 1000;
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
    }
    .chip{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(0,0,0,.1);
      font-size:12px;
      font-weight:1000;
    }
    .hr{
      height:1px;
      background:rgba(0,0,0,.08);
      margin: 12px 0;
    }
    .muted{
      color:#666;
      font-size:12px;
    }
    .codebox{
      width:100%;
      min-height:180px;
      border:1px solid rgba(0,0,0,.12);
      border-radius:12px;
      padding:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:12px;
      line-height:1.5;
      resize:vertical;
      background:#fff;
    }

    .stage{
      flex:1;
      position:relative;
      background:#dfe6ef;
      overflow:hidden;
    }
    .map{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      user-select:none;
      pointer-events:none;
    }
    #citiesLayer{
      position:absolute;
      inset:0;
    }

    .city{
      position:absolute;
      transform: translate(-50%, -50%);
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      border: 2px solid rgba(0,0,0,.10);
      box-shadow: 0 10px 16px rgba(0,0,0,.10);
      transition: opacity 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      white-space:nowrap;
    }

    .city {
  touch-action: none;
}

.city.layout-edit {
  cursor: grab;
  touch-action: none;
}

.city.layout-edit.dragging {
  cursor: grabbing;
}
    .city:hover{
      z-index: 3;
    }
    .city.layout-edit{
      cursor: grab;
      border-style: dashed;
    }
    .city.layout-edit.dragging{
      cursor: grabbing;
      z-index: 50;
      box-shadow: 0 18px 32px rgba(0,0,0,.22);
    }
    .dot{
      width:11px;
      height:11px;
      border-radius:999px;
      background:#111;
      flex:0 0 auto;
    }
    .label{
      font-size:12px;
      font-weight:1000;
      color:#111;
    }

    .city.selected{
      background: rgba(47,125,255,.12);
      border-color: rgba(47,125,255,.85);
      box-shadow: 0 14px 22px rgba(47,125,255,.22);
    }
    .city.selected .dot{
      background:#2f7dff;
    }
    .city.selected::after{
      content:"✔";
      font-weight:1000;
      margin-left: 2px;
      color:#2f7dff;
    }

    .city.eliminated{
      opacity:.18;
      pointer-events:none;
      filter: grayscale(1);
    }
    .city.guessable{
      outline: 2px solid rgba(47,125,255,.18);
    }

    .city.layout-edit.eliminated{
      pointer-events:auto;
    }

    .toast{
      position:absolute;
      left:50%;
      top:18px;
      transform: translateX(-50%);
      background: rgba(17,17,17,.92);
      color:#fff;
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 1000;
      font-size: 13px;
      box-shadow: 0 16px 28px rgba(0,0,0,.18);
      opacity:0;
      pointer-events:none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 20;
      max-width: 80%;
      text-align:center;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(2px);
    }
    .toast .sub{
      display:block;
      font-weight:700;
      opacity:.8;
      font-size:12px;
      margin-top:4px;
    }

    .hostBox{
      position:absolute;
      right:16px;
      top:16px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 14px 24px rgba(0,0,0,.12);
      z-index: 20;
      display:none;
      min-width: 220px;
    }
    .hostBox.show{
      display:block;
    }
    .hostTitle{
      font-weight:1000;
      font-size:12px;
      margin-bottom:6px;
    }
    .hostAns{
      font-weight:1000;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="title">바울 2차 전도여행 · 하나님의 목적지 찾기</div>

      <div class="row" style="justify-content:space-between">
        <span id="stepBadge" class="step">STEP 0</span>
        <button id="resetBtn" class="btn secondary small">리셋</button>
      </div>

      <div id="panelBody" class="desc"></div>

      <div class="hr"></div>

      <div class="row">
        <span class="chip">남은 도시 <b id="remainCount">0</b></span>
        <span class="chip">선택 <b id="pickCount">0</b></span>
      </div>

      <div class="hr"></div>

      <div id="controls"></div>

      <div id="layoutEditorSection" style="display:none">
        <div class="hr"></div>
        <div class="muted"><b>수동 위치 보정값(JSON)</b></div>
        <textarea id="layoutJson" class="codebox" spellcheck="false"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="copyLayoutBtn" class="btn secondary small">JSON 복사</button>
          <button id="resetLayoutBtn" class="btn secondary small">수동값 초기화</button>
        </div>
        <div class="muted" style="margin-top:8px">
          편집 모드 주소: <b>?layout=edit</b><br>
          진행자 모드 주소: <b>?role=host</b><br>
          같이 쓰기: <b>?role=host&layout=edit</b>
        </div>
      </div>

      <div class="hr"></div>
      <div class="muted">
        진행자 모드: <b>?role=host</b><br>
        레이아웃 편집: <b>?layout=edit</b>
      </div>
    </aside>

    <main class="stage">
      <img class="map" src="worldmap.jpg" alt="worldmap">
      <div id="citiesLayer"></div>
      <div id="toast" class="toast">안내<span class="sub">서브</span></div>

      <div id="hostBox" class="hostBox">
        <div class="hostTitle">진행자 전용 정답</div>
        <div id="hostAnswer" class="hostAns">-</div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
