<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>바울의 전도여행: 하나님의 목적지 찾기</title>
  <style>
    :root {
      --panelW: 200px; /* 폭을 약 절반으로 축소 */
      --cardBg: rgba(255, 255, 255, 0.9);
      --primary: #2f7dff;
      --radius: 20px;
      --shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; font-family: 'Pretendard', sans-serif;
      background: #000;
    }

    .stage { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
    .map { width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; }

    /* 힌트 창 (상단 유지) */
    .hint-panel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.75); color: #fff;
      padding: 15px; border-radius: 15px;
      z-index: 1000; display: none;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
      width: 200px; box-shadow: var(--shadow);
    }
    .hint-panel div { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }

    /* 조작 패널 (폭 축소 및 폰트 확대) */
    .panel {
      position: absolute; bottom: 15px; left: 15px;
      width: var(--panelW); max-height: calc(100vh - 30px);
      background: var(--cardBg); backdrop-filter: blur(12px);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; z-index: 100; border: 1px solid rgba(255,255,255,0.3);
      display: flex; flex-direction: column;
    }

    /* 도시 레이블 */
    #citiesLayer { position: absolute; inset: 0; z-index: 10; }
    .city {
      position: absolute; transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 6px 12px; border-radius: 999px;
      background: #fff; border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s;
    }
    .city.selected {
      background: var(--primary) !important; border-color: #fff !important;
      transform: translate(-50%, -50%) scale(1.1); z-index: 50;
    }
    .city.selected .label { color: #fff !important; }
    .city.eliminated { opacity: 0.15; filter: grayscale(1); pointer-events: none; }

    /* 승리 오버레이 */
    .victory-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2000; backdrop-filter: blur(10px);
    }
    .victory-overlay.show { display: flex; }
    .victory-card {
      background: #fff; padding: 30px; border-radius: 30px; text-align: center;
      width: 320px; box-shadow: var(--shadow);
    }

    /* 텍스트 및 버튼 크기 조정 */
    #panelBody { font-size: 15px; font-weight: 500; margin: 10px 0; line-height: 1.4; }
    .btn { 
      width: 100%; padding: 12px; border-radius: 12px; border: 0; 
      background: #111; color: #fff; font-weight: 800; cursor: pointer; 
      font-size: 16px; margin-top: 8px;
    }
    .btn.secondary { background: #fff; color: #111; border: 1px solid rgba(0,0,0,0.1); }
    
    /* 좁은 폭을 위한 그리드 배치 */
    .dice-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
    .dice-grid .btn { margin-top: 0; padding: 8px; font-size: 14px; }
    
    .hint-stack { display: flex; flex-direction: column; gap: 5px; }
    .hint-stack .btn { margin-top: 0; font-size: 14px; padding: 10px; }

    .row-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-top: 10px; color: #444; }
    .hr { height: 1px; background: rgba(0,0,0,0.1); margin: 12px 0; }
  </style>
</head>
<body>
  <div id="hintPanel" class="hint-panel">
    <div style="font-weight: 800; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; margin-bottom: 10px;">💡 힌트 정보</div>
    <div id="hintContinent">대륙: <b>?</b></div>
    <div id="hintEn">영어: <b id="hintEnList">?</b></div>
    <div id="hintKo">초성: <b id="hintKoList">?</b></div>
  </div>

  <main class="stage">
    <div id="mapViewport" class="map-viewport" style="position:relative; width:100%; height:100%;">
      <img class="map" src="worldmap.jpg" alt="worldmap">
      <div id="citiesLayer"></div>
    </div>
  </main>

  <aside class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="stepBadge" style="background:#111; color:#fff; padding:3px 8px; border-radius:8px; font-size:11px; font-weight:800;">STEP 0</span>
      <b style="font-size:16px;">전도여행</b>
    </div>
    <div id="panelBody"></div>
    <div id="controls"></div>
    <div class="row-info">
      <span>남은: <span id="remainCount">0</span></span>
      <span>선택: <span id="pickCount">0</span></span>
    </div>
    <div class="hr"></div>
    <button id="fullResetBtn" class="btn secondary" style="font-size:13px; padding:8px;">초기화</button>
  </aside>

  <div id="victoryOverlay" class="victory-overlay">
    <div class="victory-card">
      <h2 style="margin:0; font-size:20px;">축하합니다! 🎉</h2>
      <p style="font-size:14px; color:#666; margin:10px 0;">하나님이 계획하신 목적지</p>
      <div id="victoryCityName" style="font-size:32px; color:var(--primary); font-weight:900; margin-bottom:20px;"></div>
      <button onclick="location.reload()" class="btn">다시 시작</button>
    </div>
  </div>

  <div id="toast" style="position:fixed; bottom:15px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:#fff; padding:10px 20px; border-radius:10px; z-index:3000; opacity:0; transition:0.3s; pointer-events:none; font-size:13px;"></div>

  <script src="app.js"></script>
</body>
</html>
